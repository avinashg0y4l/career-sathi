<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Career Sathi</title>
</head>
<body>
  <h2>Login</h2>
  <form id="loginForm">
    <input type="email" name="email" placeholder="Email" required /><br><br>
    <input type="password" name="password" placeholder="Password" required /><br><br>
    <button type="submit">Login</button>
  </form>

  <script>
    const API_URL = "https://your-railway-backend-url.up.railway.app"; // <-- Replace with your deployed backend URL

    const form = document.getElementById('loginForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        email: form.email.value,
        password: form.password.value
      };

      try {
        const res = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();

        if(res.ok) { // res.ok is true for 2xx responses
          alert(result.message);
          localStorage.setItem('user', JSON.stringify(result.user));
          window.location.href = 'addjob.html'; // redirect to add job page
        } else {
          alert(result.error || "Login failed");
        }
      } catch (err) {
        console.error('Login error:', err);
        alert("Failed to connect to server. Try again later.");
      }
    });
  </script>
</body>
</html>
