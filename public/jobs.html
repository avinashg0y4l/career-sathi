<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jobs - Career Sathi</title>
</head>
<body>
  <h2>Job Listings</h2>
  <ul id="jobList"></ul>

  <script>
    const API_URL = "https://your-railway-backend-url.up.railway.app"; // <-- Replace with your deployed backend

    async function loadJobs() {
      try {
        const res = await fetch(`${API_URL}/jobs`);
        const jobs = await res.json();
        const list = document.getElementById('jobList');
        list.innerHTML = '';

        if (jobs.length === 0) {
          list.innerHTML = '<li>No jobs available.</li>';
          return;
        }

        jobs.forEach(job => {
          const li = document.createElement('li');
          li.innerHTML = `<strong>${job.title}</strong> at ${job.company || 'N/A'} (Posted by: ${job.posted_by_name})`;
          list.appendChild(li);
        });
      } catch (err) {
        console.error('Error fetching jobs:', err);
        document.getElementById('jobList').innerHTML = '<li>Failed to load jobs. Please try again later.</li>';
      }
    }

    loadJobs();
  </script>
</body>
</html>
