<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Job - Career Sathi</title>
</head>
<body>
  <h2>Add Job</h2>
  <form id="jobForm">
    <input type="text" name="title" placeholder="Job Title" required /><br><br>
    <input type="text" name="company" placeholder="Company" /><br><br>
    <textarea name="description" placeholder="Description"></textarea><br><br>
    <button type="submit">Add Job</button>
  </form>

  <script>
    const API_URL = "https://your-railway-backend-url.up.railway.app"; // <-- Replace with your deployed backend

    const form = document.getElementById('jobForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Get logged-in user
      const user = JSON.parse(localStorage.getItem('user'));
      if (!user) {
        alert('Please login first to add jobs!');
        window.location.href = 'login.html';
        return;
      }

      const data = {
        title: form.title.value,
        company: form.company.value,
        description: form.description.value,
        posted_by: user.id
      };

      try {
        const res = await fetch(`${API_URL}/jobs`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await res.json();
        alert(result.message || result.error);

        if (res.status === 201) {
          window.location.href = 'jobs.html';
        }

      } catch (err) {
        console.error('Error adding job:', err);
        alert('Something went wrong. Please try again later.');
      }
    });
  </script>
</body>
</html>
